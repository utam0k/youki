<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="title desc">
<title id="title">Two ways to use youki</title><desc id="desc">Existing tools select the youki executable. Rust platforms can embed libcontainer and supply their own Executor. Both paths use the shared Rust core to set up Linux container isolation.</desc>
<style>
  svg { --canvas:#ffffff; --panel:#f6f6f7; --text:#252529; --muted:#58585f; --line:#929299; --border:#d8d8dd; --accent:#a94224; --accent-bg:#fff4ee; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  @media (prefers-color-scheme:dark) { svg { --canvas:#1b1b1f; --panel:#252529; --text:#ececf0; --muted:#b8b8c2; --line:#92929b; --border:#55555f; --accent:#f1a186; --accent-bg:#36251f; } }
  .canvas { fill:var(--canvas); }
  .box { fill:var(--panel); stroke:var(--border); stroke-width:1.5; }
  .accent { fill:var(--accent-bg); stroke:var(--accent); }
  .title { fill:var(--text); font-size:25px; font-weight:650; }
  .body { fill:var(--muted); font-size:19px; }
  .label { fill:var(--muted); font-size:18px; }
  .arrow { fill:none; stroke:var(--line); stroke-width:2; stroke-linejoin:round; marker-end:url(#arrow); }
  .connector { fill:none; stroke:var(--line); stroke-width:2; stroke-linejoin:round; }
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--line)"/></marker></defs>
<rect class="canvas" width="480" height="600" rx="8"/>
<text class="label" x="124" y="30" text-anchor="middle">Existing tools</text>
<text class="label" x="358" y="30" text-anchor="middle">Build in Rust</text>
<rect class="box" x="16" y="48" width="216" height="86" rx="6"/>
<text class="title" x="124" y="85" text-anchor="middle" style="font-size:23px">Docker · Podman</text>
<text class="body" x="124" y="115" text-anchor="middle">containerd</text>
<path class="arrow" d="M124 134 V174"/>
<rect class="box accent" x="16" y="174" width="216" height="78" rx="6"/>
<text class="title" x="124" y="207" text-anchor="middle">youki</text>
<text class="body" x="124" y="235" text-anchor="middle">OCI runtime CLI</text>
<rect class="box" x="252" y="48" width="212" height="204" rx="6"/>
<text class="title" x="358" y="113" text-anchor="middle">Your Rust</text>
<text class="title" x="358" y="145" text-anchor="middle">runtime</text>
<text class="body" x="358" y="187" text-anchor="middle">Your policy</text>
<text class="body" x="358" y="217" text-anchor="middle">+ custom Executor</text>
<path class="connector" d="M124 252 V286 H358 V252"/>
<path class="arrow" d="M240 286 V320"/>
<rect class="box accent" x="82" y="320" width="316" height="100" rx="6"/>
<text class="title" x="240" y="361" text-anchor="middle">libcontainer</text>
<text class="body" x="240" y="393" text-anchor="middle">Shared Rust core</text>
<path class="arrow" d="M240 420 V464"/>
<rect class="box" x="82" y="464" width="316" height="100" rx="6"/>
<text class="title" x="240" y="505" text-anchor="middle">Linux kernel</text>
<text class="body" x="240" y="536" text-anchor="middle">Namespaces · cgroups · mounts</text>
</svg>
